name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: [self-hosted, linux]

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Docker Login
      # -------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # Build Docker Image
      # -------------------------

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:latest \
            .

      # -------------------------
      # Push Image to Docker Hub
      # -------------------------

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:latest

      # -------------------------
      # Deploy to Kubernetes
      # -------------------------

      - name: Deploy to Minikube
        run: |

          kubectl apply -f k8s/namespace.yaml

          kubectl apply -f k8s/pvc.yaml

          kubectl apply -f k8s/deployment.yaml

          kubectl apply -f k8s/service.yaml

          kubectl -n devops-demo set image \
            deployment/python-app \
            python-app=${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:${{ github.sha }}

          kubectl -n devops-demo rollout status deployment/python-app